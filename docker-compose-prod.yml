version: '3.7'

services:
  db:
    restart: always
    image: postgres:12
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=pwd
    volumes:
      - "insta_db:/var/lib/postgresql/data"
    expose:
      - 5432
    ports:
      - 5433:5432
    networks:
      - insta_tier


  redis:
    image: redis:latest
    container_name: rd0101
    networks:
      - insta_tier
  django_gunicorn:
    command: gunicorn instaDjangoApi.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - static:/static
    build:
      context: .
    ports:
      - "8000:8000"
    expose:
      - "8000"
    environment:
      - DJANGO_COLLECT_STATIC=off
      - DJANGO_MANAGEPY_MIGRATE=on
    networks:
      - insta_tier
    links:
      - db:postgres
      - redis
    depends_on:
      - redis
      - db

  celery:
    build: .
    command: celery -A instaDjangoApi worker -l info
    depends_on:
      - db
      - redis
    networks:
      - insta_tier

  beat:
    build: .
    restart: unless-stopped
    depends_on:
      - redis
      - db
    command: celery -A instaDjangoApi beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    restart: unless-stopped
    networks:
      - insta_tier

  nginx:
    build: ./nginx
    volumes:
      - static:/static
    ports:
      - "80:80"
      - "443:443"
    expose:
      - "80"
      - "443"
    depends_on:
      - django_gunicorn
    networks:
      - insta_tier
volumes:
  insta_db:
    driver: local
  static:


networks:
  insta_tier:
    driver: bridge
