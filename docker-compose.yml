version: '3.1'
services:
  db:
    restart: always
    image: postgres:12
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=pwd
    volumes:
      - "insta_db:/var/lib/postgresql/data"
    expose:
      - 5432
    ports:
      - 5433:5432
    networks:
      - insta_tier

  redis:
    image: redis:latest
    container_name: rd01
    networks:
      - insta_tier

  webapp:
    restart: always
    build: .
    container_name: wa01
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    links:
      - redis
    environment:
      - DJANGO_COLLECT_STATIC=off
      - DJANGO_MANAGEPY_MIGRATE=on
    depends_on:
      - db
      - redis
    networks:
      - insta_tier
    volumes:
      - .:/app



  celery:
    build: .
    container_name: cl05
    command: celery -A instaDjangoApi worker -l info --autoscale=10,3
    links:
      - redis
    networks:
      - insta_tier
  
  beat:
    build: .
    depends_on:
      - redis
    command: celery -A instaDjangoApi beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    restart: unless-stopped
    networks:
      - insta_tier

  nodejs:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: nd01
    command:  bash -c "npm install && npm start"
    # command: npm start
    ports:
      - "3000:3001"
    expose:
      - 3000
    networks:
      - insta_tier
    volumes:
      - './app:/src'
      # - '/app/node_modules'
      # - '/app/node_modules/.bin'
  
volumes:
  insta_db:
    driver: local
  static_volume:
    driver: local
networks:
  insta_tier:
    driver: bridge