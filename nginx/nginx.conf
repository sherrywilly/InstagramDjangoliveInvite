upstream django {
	server django_gunicorn:8000;
}

server {
    server_tokens off;
	listen 80;
    client_max_body_size 20M;
	location /static/ {
		alias /app/static/;
	}
    location /media/ {
		alias /app/media/;
	}
	location / {
        # limit_req zone=mylimit;
        proxy_pass http://django ;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
	  
}